[workspace]
resolver = "3"
members = [
    "crates/flora-aggregator",
    "crates/flora-analytics",
    "crates/flora-api",
    "crates/flora-auth",
    "crates/flora-db",
    "crates/flora-device",
    "crates/flora-drivers",
    "crates/flora-ingest",
    "crates/flora-node",
    "crates/flora-protocol",
    "crates/flora-provision",
    "crates/flora-server",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates. Device-facing crates are `no_std` and must build for
# thumbv6m, so nothing in this group may pull a runtime dependency on `std`.
# `default-features = false` here: firmware members (via flora-device)
# inherit wire-less no_std serde; host consumers (provision, ingest, api)
# opt in with features = ["wire"].
flora-protocol = { path = "crates/flora-protocol", default-features = false }
flora-drivers = { path = "crates/flora-drivers" }
flora-device = { path = "crates/flora-device" }
flora-db = { path = "crates/flora-db" }
flora-auth = { path = "crates/flora-auth" }
flora-ingest = { path = "crates/flora-ingest" }
flora-analytics = { path = "crates/flora-analytics" }
flora-api = { path = "crates/flora-api" }
flora-server = { path = "crates/flora-server" }

# Firmware toolchain, shared by flora-node and flora-aggregator. Kept in one
# place because the embassy family must move together: two copies of the HAL
# against one set of PAC peripherals do not link.
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10", default-features = false, features = ["defmt", "rp2040", "time-driver", "critical-section-impl"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
heapless = "0.9"
# Ed25519 command verification. no_std so the aggregator verifies app
# signatures on the same crate host tests use.
ed25519-compact = { version = "2", default-features = false }
# Cryptography: Ed25519 signature checks and SHA-256 device-id derivation.
# sha2 stays no_std (thumbv6m-linkable); enable the asm backend only where
# the target provides one.
sha2 = { version = "0.10", default-features = false }
# Wire models: serde without std so the same structs compile for thumbv6m
# (serde-json-core) and the host (serde_json). Borrowed fields only —
# no side allocates to parse a wire message.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
serde-json-core = "0.6"
panic-probe = { version = "1", features = ["print-defmt"] }
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1"

# Aggregator only: Pico W radio and network stack. `cyw43-pio` must match
# embassy-rp's major.minor or two incompatible HAL copies get compiled.
embassy-net = { version = "0.9", default-features = false, features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
cyw43 = { version = "0.7", default-features = false, features = ["defmt"] }
cyw43-pio = { version = "0.10", default-features = false }

# Server side (host only). Versions carried from the v1 cloud workspace.
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.3"
hex = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
password-hash = { version = "0.6", features = ["getrandom"] }
parking_lot = "0.12"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "limit"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Integration-test surface for flora-api: the tests drive the real router
# through tower's ServiceExt::oneshot and sign with dalek, matching the app.
tower = { version = "0.5", default-features = false, features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Firmware ships from the same profile but needs symbols for probe-rs and
# size reporting; host/server binaries stay stripped.
[profile.firmware]
inherits = "release"
debug = true
strip = false
