include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # `use_null_aware_elements` wants `?expr` inside collection literals, which
    # is unreadable for a conditional map entry. The `if (x != null)` form is
    # clearer here and is what the rest of the codebase uses.
    use_null_aware_elements: ignore
    # The named-parameter form keeps the constructor signature self-documenting.
    prefer_initializing_formals: ignore
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # A screen that awaits a discarded future is a bug worth catching.
    unawaited_futures: true
    # Prefer explicit types on public API.
    always_declare_return_types: true
