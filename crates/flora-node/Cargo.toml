[package]
name = "flora-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flora-node"
path = "src/bin/firmware.rs"
required-features = ["firmware"]

# Hello-world placeholder so the workspace resolves; the firmware feature
# and the thumbv6m build arrive with the firmware chunk.
[features]
firmware = []
