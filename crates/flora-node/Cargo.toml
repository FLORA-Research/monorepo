[package]
name = "flora-node"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flora-node"
path = "src/bin/firmware.rs"
required-features = ["firmware"]

# The library is `no_std` and builds on the host, so its logic can be tested
# without hardware. The `firmware` feature pulls in the Embassy runtime and
# the RP2040 HAL; the binary needs it and only builds for thumbv6m.
[features]
firmware = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:embassy-executor",
    "dep:embassy-rp",
    "dep:embassy-time",
    "dep:embassy-usb",
    "dep:embedded-hal-nb",
    "dep:heapless",
    "dep:panic-probe",
    "dep:portable-atomic",
    "dep:static_cell",
]

[dependencies]
flora-device = { workspace = true }
flora-drivers = { workspace = true }
flora-protocol = { workspace = true, features = ["provision"] }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
embedded-hal-nb = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
# The provisioning handshake parses borrowed JSON on the device.
serde = { workspace = true }
serde-json-core = { workspace = true }
panic-probe = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
