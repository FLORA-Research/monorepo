[package]
name = "flora-aggregator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flora-aggregator"
path = "src/bin/firmware.rs"
required-features = ["firmware"]

# The library is `no_std` and builds on the host, so its logic can be tested
# without hardware. The `firmware` feature pulls in the Embassy runtime, the
# RP2040 HAL, and the Pico W radio; the binary needs it and only builds for
# thumbv6m.
[features]
firmware = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:embassy-rp",
    "dep:embassy-time",
    "dep:embassy-usb",
    "dep:cyw43",
    "dep:cyw43-pio",
    "dep:embedded-io-async",
    "dep:embedded-nal-async",
    "dep:panic-probe",
    "dep:portable-atomic",
    "dep:static_cell",
]

[dependencies]
flora-device = { workspace = true }
# The wifi dictionary module (host-testable) uses heapless vectors without
# the firmware feature; the Embassy path reuses the same dependency.
heapless = { workspace = true }
cortex-m = { workspace = true, optional = true }
cortex-m-rt = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
cyw43 = { workspace = true, optional = true }
cyw43-pio = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
embedded-nal-async = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
