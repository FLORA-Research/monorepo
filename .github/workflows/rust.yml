name: rust

# Host CI for the Rust workspace: fmt, clippy, tests. The firmware binaries
# are skipped by cargo itself (required-features), so this job needs no
# cross toolchain and stays fast. Firmware targets are built by firmware.yml.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "crates/flora-db/migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "crates/flora-db/migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches the service container below. `sslmode=disable` because the
  # connection is over the job's own loopback. The database layer skips
  # its live tests when this is unset, which is convenient locally and a
  # trap in CI: the service below exists so they actually run, and the
  # final step fails the job if they were skipped anyway.
  TEST_DATABASE_URL: postgres://flora:flora@localhost:5432/flora_test?sslmode=disable

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flora
          POSTGRES_PASSWORD: flora
          POSTGRES_DB: flora_test
        ports:
          - 5432:5432
        # Without this the tests race the database's first start and fail
        # on a refused connection.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The whole workspace is one lockfile, so one shared cache prefix lets
      # every Rust job (rust, firmware, release) reuse the same dependency
      # build when the lockfile agrees. `shared-key` keyed on Cargo.lock
      # makes that reuse explicit rather than incidental.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          shared-key: rust-workspace
          # Clippy and test build different artifacts; keep both from the
          # same job so a rerun of either is warm.
          cache-targets: true
      # Grep this run's output instead of running the suite twice.
      # `pipefail` keeps a failing cargo behind `tee` fatal.
      - name: clippy
        shell: bash
        run: set -o pipefail; cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - run: cargo fmt --all --check
      - name: test
        shell: bash
        run: set -o pipefail; cargo test --workspace --locked 2>&1 | tee test.log
      - name: fail if integration tests were skipped
        run: |
          # A skip prints this and passes. Catching it here means a
          # missing database breaks the build instead of quietly
          # removing coverage.
          if grep -q "TEST_DATABASE_URL unset; skipping" test.log; then
            echo "::error::integration tests were skipped; TEST_DATABASE_URL was not visible to them"
            exit 1
          fi
