name: app

# The app is the only component a person outside the project touches, so
# this checks it the way a person would: analyze for mistakes the compiler
# tolerates, then run the tests.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the analyzer gains lints between releases, so an
          # unpinned channel fails the build on a day nobody changed
          # anything.
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # `pub` alone is the small half: the Android build spends most of
      # its time on Gradle and the AGP/Maven dependencies, which flutter
      # does not cache. ~/.gradle is the bulk of a cold APK build.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # Analysis is a gate, not advice: a warning here is a warning in an
      # editor nobody reads.
      - run: flutter analyze lib test
      - run: flutter test
